<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no">
<!-- ホーム画面に追加したとき全画面で開く（iPadOS 16 は apple- 系の指定が必要） -->
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black">
<meta name="apple-mobile-web-app-title" content="掲示板">
<meta name="format-detection" content="telephone=no">
<title>リビングの電光掲示板</title>

<!--
  favicon。小さく出る場面では文字が潰れるため、
  タブ用は十字のドットだけ、ホーム画面用は "EM" と描き分けている（assets/make-favicon.py）。
-->
<link rel="icon" href="/favicon.ico" sizes="32x32">
<link rel="icon" href="/favicon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="/apple-touch-icon.png">

<!--
  URL を Discord などに貼ったときのカード表示。
  og:image は絶対URLでないと読まれないため、本番のURLを直接書く。
-->
<meta property="og:type" content="website">
<meta property="og:site_name" content="リビングの電光掲示板">
<meta property="og:title" content="リビングの電光掲示板">
<meta property="og:description" content="シェアハウスのリビングに置いた iPad に、お知らせが流れています。Discord から投稿できます。">
<meta property="og:url" content="https://signboard.emaker.dev/">
<meta property="og:image" content="https://signboard.emaker.dev/ogp.png">
<meta property="og:image:width" content="1200">
<meta property="og:image:height" content="630">
<meta property="og:image:alt" content="黒地に琥珀色のドットで SIGNBOARD と描かれた電光掲示板風の画像">
<meta property="og:locale" content="ja_JP">
<meta name="twitter:card" content="summary_large_image">
<meta name="theme-color" content="#000000">
<meta name="description" content="シェアハウスのリビングに置いた iPad に、お知らせが流れています。Discord から投稿できます。">
<link rel="stylesheet" href="/style.css">
</head>
<body>
  <div id="screen">
    <header id="clock-area">
      <div id="date"></div>
      <div id="time"></div>
    </header>

    <main id="ticker">
      <!-- スクロールする帯。JS が中身を差し替える -->
      <div id="track"><span id="content"></span></div>
    </main>

    <!-- 新着が届いた瞬間に一瞬光る板。表示の上に重ねるだけで文字は隠さない -->
    <div id="flash"></div>

    <!-- 最後にお知らせが追加された時刻。いつから変わっていないかが分かる -->
    <div id="latest" hidden></div>

    <div id="status" hidden></div>

    <!-- パソコンで見たとき用。iPad は「ホーム画面に追加」で全画面になるので出さない -->
    <button id="fullscreen" type="button" hidden aria-label="全画面表示にする" title="全画面表示 (f)">
      <svg viewBox="0 0 24 24" width="22" height="22" aria-hidden="true">
        <path id="fs-icon" fill="none" stroke="currentColor" stroke-width="2"
              stroke-linecap="round" stroke-linejoin="round"
              d="M4 9V4h5M20 9V4h-5M4 15v5h5M20 15v5h-5"></path>
      </svg>
    </button>
  </div>
  <script src="/app.js"></script>
</body>
</html>
