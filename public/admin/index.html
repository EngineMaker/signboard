<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>掲示板の管理</title>
<link rel="stylesheet" href="/admin/admin.css">
</head>
<body>
  <header class="topbar">
    <h1>掲示板の管理</h1>
    <div class="user">
      <span id="user-name"></span>
      <a href="/auth/logout" class="link">ログアウト</a>
    </div>
  </header>

  <nav class="tabs" role="tablist">
    <button class="tab is-active" data-tab="notices" role="tab">お知らせ</button>
    <button class="tab" data-tab="settings" role="tab">表示設定</button>
    <button class="tab" data-tab="audit" role="tab">操作履歴</button>
  </nav>

  <main>
    <!-- お知らせ -->
    <section id="panel-notices" class="panel">
      <form id="new-notice" class="card">
        <h2>新しいお知らせ</h2>
        <textarea id="new-body" rows="2" maxlength="200"
                  placeholder="例) 土曜に共用部の大掃除やります。10時集合"></textarea>
        <div class="row">
          <label>
            表示期限
            <select id="new-expiry">
              <option value="">24時間（既定）</option>
              <option value="3">3時間</option>
              <option value="12">12時間</option>
              <option value="72">3日</option>
              <option value="168">1週間</option>
            </select>
          </label>
          <span class="counter"><span id="new-count">0</span>/200</span>
          <button type="submit" class="primary">投稿する</button>
        </div>
      </form>

      <div id="notice-list" class="list"></div>
    </section>

    <!-- 表示設定 -->
    <section id="panel-settings" class="panel" hidden>
      <form id="settings-form" class="card">
        <h2>表示設定</h2>
        <p class="hint">変更はリビングの iPad にすぐ反映されます。</p>

        <label class="field">
          スクロール速度
          <span class="value"><span id="speed-value"></span> px/秒</span>
          <input type="range" id="scrollSpeed" min="60" max="600" step="10">
        </label>

        <label class="field">
          文字サイズ
          <span class="value"><span id="font-value"></span>（画面高さの%）</span>
          <input type="range" id="fontScale" min="6" max="30" step="1">
        </label>

        <label class="field">
          お知らせが無いときの文言
          <input type="text" id="fallbackText" maxlength="200">
        </label>

        <div class="row">
          <button type="submit" class="primary">保存する</button>
          <span id="settings-status" class="status"></span>
        </div>
      </form>
    </section>

    <!-- 操作履歴 -->
    <section id="panel-audit" class="panel" hidden>
      <div class="card">
        <h2>操作履歴</h2>
        <p class="hint">誰がいつ何をしたかの記録です。消すことはできません。</p>
        <label class="field">
          種類でしぼる
          <select id="audit-filter">
            <option value="">すべて</option>
          </select>
        </label>
      </div>
      <div id="audit-list" class="list"></div>
    </section>
  </main>

  <div id="toast" class="toast" hidden></div>
  <script src="/admin/admin.js"></script>
</body>
</html>
